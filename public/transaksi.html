<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Riwayat Transaksi Ladang Usaha">
  <title>Transaksi - Ladang Usaha</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="sidebar-overlay"></div>

  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-header">
        <img src="/assets/logo.png" alt="Ladang Usaha" class="sidebar-logo">
        <span class="sidebar-brand">Ladang Usaha</span>
      </div>

      <nav class="sidebar-nav" id="sidebar-nav">
      </nav>

      <div class="sidebar-footer">
        <div class="user-info">
          <div class="user-avatar" id="user-initials"></div>
          <div class="user-details">
            <div class="user-name" id="user-name"></div>
            <div class="user-role" id="user-role-display"></div>
          </div>
          <button onclick="App.logout(); window.location.href='/login.html'" style="background: none; color: var(--muted); padding: 4px;" aria-label="Keluar">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          </button>
        </div>
      </div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <div style="display: flex; align-items: center; gap: 12px;">
          <button class="menu-toggle" aria-label="Toggle menu">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>
          <div>
            <h1 class="page-title">Transaksi</h1>
            <p class="page-subtitle" id="transaction-subtitle">Riwayat transaksi usaha</p>
          </div>
        </div>
      </header>

      <div class="page-content">
        <div class="filter-bar">
          <div class="search-bar">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" id="search-transaction" class="input" placeholder="Cari nomor transaksi...">
          </div>
          <input type="date" id="filter-date-from" class="input" aria-label="Dari tanggal">
          <input type="date" id="filter-date-to" class="input" aria-label="Sampai tanggal">
          <select id="filter-payment" class="select">
            <option value="">Semua Metode</option>
            <option value="CASH">Cash</option>
            <option value="QRIS">QRIS</option>
            <option value="TRANSFER">Transfer</option>
          </select>
          <select id="filter-cashier" class="select" style="display: none;">
            <option value="">Semua Kasir</option>
          </select>
        </div>

        <div id="transactions-loading" class="hidden">
          <div class="skeleton skeleton-text"></div>
          <div class="skeleton skeleton-text"></div>
          <div class="skeleton skeleton-text"></div>
          <div class="skeleton skeleton-text"></div>
          <div class="skeleton skeleton-text"></div>
        </div>

        <div id="transactions-empty" class="hidden">
          <div class="empty-state">
            <div style="font-size: 3rem; margin-bottom: 16px;">📋</div>
            <div class="empty-state-title">Belum ada transaksi</div>
            <div class="empty-state-description">Transaksi akan muncul setelah ada pembelian</div>
          </div>
        </div>

        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>Nomor Transaksi</th>
                <th>Kasir</th>
                <th>Total</th>
                <th>Pembayaran</th>
                <th>Status</th>
                <th>Aksi</th>
              </tr>
            </thead>
            <tbody id="transactions-table-body"></tbody>
          </table>
        </div>

        <div id="pagination" style="display: flex; justify-content: center; gap: 8px; margin-top: 24px;"></div>
      </div>
    </main>
  </div>

  <div class="modal-overlay" id="transaction-detail-modal">
    <div class="modal">
      <div class="modal-header">
        <h2 class="modal-title">Detail Transaksi</h2>
        <button class="modal-close" onclick="App.hideModal('transaction-detail-modal')">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="modal-body" id="transaction-detail-content"></div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="App.hideModal('transaction-detail-modal')">Tutup</button>
      </div>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script src="/js/transaksi.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const role = App.user?.role;
      const sidebarNav = document.getElementById('sidebar-nav');
      const roleDisplay = document.getElementById('user-role-display');
      const subtitle = document.getElementById('transaction-subtitle');
      const cashierFilter = document.getElementById('filter-cashier');

      if (role === 'OWNER') {
        if (roleDisplay) roleDisplay.textContent = 'Pemilik';
        if (subtitle) subtitle.textContent = 'Riwayat transaksi usaha';
        if (cashierFilter) cashierFilter.style.display = 'block';
        if (sidebarNav) {
          sidebarNav.innerHTML = `
            <div class="nav-section">
              <a href="/dashboard.html" class="nav-item">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
                Dashboard
              </a>
            </div>
            <div class="nav-section">
              <div class="nav-section-title">Manajemen</div>
              <a href="/produk.html" class="nav-item">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
                Produk
              </a>
              <a href="/transaksi.html" class="nav-item active">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
                Transaksi
              </a>
              <a href="/laporan.html" class="nav-item">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
                Laporan
              </a>
            </div>
            <div class="nav-section">
              <div class="nav-section-title">Pengaturan</div>
              <a href="/pengguna.html" class="nav-item">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                Pengguna
              </a>
              <a href="/pengaturan.html" class="nav-item">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                Pengaturan
              </a>
            </div>
          `;
        }
      } else {
        if (roleDisplay) roleDisplay.textContent = 'Kasir';
        if (subtitle) subtitle.textContent = 'Riwayat transaksi saya';
        if (sidebarNav) {
          sidebarNav.innerHTML = `
            <div class="nav-section">
              <a href="/kasir.html" class="nav-item">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
                POS
              </a>
            </div>
            <div class="nav-section">
              <div class="nav-section-title">Aktivitas</div>
              <a href="/transaksi.html" class="nav-item active">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                Transaksi Saya
              </a>
            </div>
            <div class="nav-section">
              <div class="nav-section-title">Akun</div>
              <button onclick="App.logout(); window.location.href='/login.html'" class="nav-item" style="width: 100%; text-align: left;">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                Keluar
              </button>
            </div>
          `;
        }
      }
    });
  </script>
</body>
</html>
